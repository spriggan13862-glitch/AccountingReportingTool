name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Backend — pytest
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-used-in-production-32chars
          DATABASE_URL: sqlite:///./test.db
          LOG_LEVEL: WARNING
        run: python -m pytest tests/ -q --tb=short

      - name: Verify alembic migration chain
        env:
          DATABASE_URL: sqlite:///./alembic_test.db
          SECRET_KEY: ci-test-secret-key-not-used-in-production-32chars
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          echo "Migration chain OK"

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript build + vitest
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Lint (non-blocking)
        run: npm run lint || true
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # E2E — Playwright smoke tests (mocked API, no backend required)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security — dependency audit (non-blocking in alpha)
  # ---------------------------------------------------------------------------
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --skip-editable || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true
